worked_answer: |
  Phase 1 (3 Nov) is S01: PO-N0001 to SUP-B for 200 at USD 340 (SAR 1,275), expected 10 Nov;
  POL-4471-1 cut to 300. Created ids follow the PO-N0001 convention (scenarios/README.md).

  SUP-B confirms PO-N0001 at 15:40 (matches the record: confirmed_date set, no re-plan; without
  it the new PO would be chased from 4 Nov, 24 h after it was placed).

  Phase 2 (8 Nov, a Sunday, which is a Saudi working day):
  1. MSG-S10-2 is from a listed SUP-B contact and "PO-N0001" resolves to POL-N0001-1 ->
     verified delay of all 200 to 28 Nov.
  2. Pegging: by 24 Nov only 400 CMP-24 (100 + 300). WO-2 keeps PO-4480's 150 (1 Dec). The
     200 from SUP-B arrive 28 Nov, so WO-1 runs 28 Nov-3 Dec: 2 days late. With no partial
     delivery, the fixed 90,000 penalty is now certain whatever we do.
  3. Options, priced against the current plan, which includes SUP-B's PO at SAR 1,275:
     OPT-WAIT2: 90,000 + 2 x 2,000 = 94,000.
     OPT-C2: SUP-B is late, so its 200 can be cancelled at no charge. SUP-C ordered 8 Nov
     + 21 days = 29 Nov; WO-1 runs 29 Nov-4 Dec, 3 days late. Incremental =
     (1,181.25 - 1,275) x 200 = -18,750 (cheaper than the supply it replaces).
     90,000 + 3 x 2,000 - 18,750 = 77,250. The line is late either way, so there is no
     risk term. SUP-B's quote OFF-B-1 expired on 6 Nov.
     OPT-C2 is best: SAR 16,750 cheaper for one more day of delay.
  4. Mandate for OPT-C2. Non-price cost = 96,000; headroom = 94,000 - 96,000 = -2,000;
     max incremental = -2,000 - 0.1 x 2,000 = -2,200 -> -11.00/unit. Max unit price =
     baseline 1,275 - 11 = SAR 1,264.00. OFF-C-1 = SAR 1,181.25: within. Latest date
     29 Nov (the arrival this option is priced on).
  5. Governance. create_po: commitment 236,250 >= 50,000 -> dual [operations_director,
     procurement_manager]. update_so_promise_date -> customer-date-change, dual [planner,
     sales_manager]. cancel_po_line, reschedule_work_order, send_customer_message -> approve.
     Bundle -> dual, one signer per kind of risk: the spend rule contributes
     operations_director, the customer-date rule sales_manager ->
     [operations_director, sales_manager].
  6. After approval: SUP-B's line cancelled, PO-N0002 to SUP-C, WO-1 and the hotel's date
     moved to 4 Dec, template messages to SUP-C, SUP-B and the hotel. replan_count = 1.

  Correction note (2026-10-18): an earlier draft priced SUP-C against SUP-A's contract
  price (+11,250) instead of the current plan and recommended waiting. Writing the
  deterministic core exposed the inconsistency.
