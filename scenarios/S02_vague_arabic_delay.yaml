worked_answer: |
  1. Claim. Sender gulf.agent@cmp-a.example is in SUP-A contacts and "PO-4471" resolves
     to POL-4471-1, so the source is genuine. But the message gives no quantity and no date
     ("may be a slight delay"), so a delay event cannot be verified: verification stays
     "unverified" with note "missing new_date". Confidence is irrelevant; even a confident
     extraction of a dateless delay changes nothing.

  2. No planning. Pegging uses verified events only, so the plan is unchanged and no
     options or mandate are produced.

  3. Follow-up. A templated status request to SUP-A asking for confirmed quantity and
     delivery date on PO-4471 is template_only -> execute tier, sent without approval.
     V1 drafts in English only (communication.draft_languages).

  4. Review task. The exposure is material (CMP-24 is critical and POL-4471-1 feeds WO-1 /
     SOL-H-1001-1, tier-1 customer, fixed penalty), so the planner gets a review task that
     names the PO, the item and the order at risk. It reports the exposure; it does not
     estimate a delay.

  5. Later (outside this window): no reply within extraction.follow_up_hours (24) ->
     status request re-sent once, then a second review task.
