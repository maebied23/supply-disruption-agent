worked_answer: |
  1. Claims. Sender is a SUP-A contact; PO-4472 resolves to POL-4472-1 (350 open, CMP-18);
     250 + 100 = 350; the quoted sentence holds both quantities and both dates. Verified.

  2. Pegging. CMP-18 supply: 100 on hand, 250 on 25 Nov, 100 on 25 Dec. Demand in need-date
     order: WO-4 (distributor, 100, starts 1 Dec) then WO-3 (developer, 350, starts 8 Dec).
     WO-4 takes 100 of the 25 Nov batch; WO-3 gets the other 150 plus the 100 on hand = 250
     and is short 100 until 25 Dec. The developer line forbids partial delivery: 400 at risk.

  3. Options (SAR).
     OPT-WAIT: WO-3 starts 25 Dec, done 30 Dec, 10 days after the 20 Dec promise; per-day
       penalty 1,500 after 3 grace days = 7 x 1,500 = 10,500; goodwill tier 2 = 7 x 500 =
       3,500 -> 14,000.
     OPT-REALLOC (serve WO-3 before WO-4): WO-3 takes 250 + 100 on hand = 350, on time. WO-4
       (tier 3, not protected) waits for the 25 Dec batch: starts 25 Dec, done 30 Dec, inside
       its 31 Dec promise. No penalty, no goodwill, no spend -> 0.
     No backup offer exists for CMP-18; no substitute is defined for it.

  4. Governance. Split POL-4472-1 to record the supplier's dates (CMP-18 is critical:
     date-update-critical, planner) and reschedule WO-4 (reallocation, planner). Bundle:
     approve, planner. APR-1 approves; nothing changed; it executes. No customer date moves,
     so no customer message.
