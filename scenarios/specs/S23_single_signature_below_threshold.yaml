worked_answer: |
  1. Claims. 470 on 10 Nov, 30 on 20 Dec on PO-4471. Verified.
  2. Shortage. WO-1 gets 470 + 100 on hand = 570 by 24 Nov: short 30. Partial delivery is not
     allowed: all 600 at risk; fixed penalty 90,000.
  3. Options (SAR).
     OPT-SUP-B: 30 (its minimum is 20 here) at 1,275, arrives 10 Nov; cancel the late 30:
       150 x 30 = 4,500; risk 0.05 x 90,000 = 4,500 -> 9,000.
     OPT-SUP-C: minimum 100, arrives 24 Nov: 56.25 x 100 = 5,625; risk 0.30 x 90,000 = 27,000
       -> 32,625. No split: C would get 10, below its minimum.
     OPT-WAIT: hotel complete 25 Dec, 24 days late: 90,000 + 48,000 = 138,000.
  4. Mandate. headroom = 32,625 - 4,500 = 28,125; less 10 % = 25,312.50; per unit 843.75;
     ceiling 1,125 + 843.75 = SAR 1,968.75. Offer 1,275: within.
  5. Governance. Commitment 30 x 1,275 = 38,250 < 50,000 and incremental 4,500 < 25,000:
     commitment-small, procurement_manager. The PO cut is also commitment-small. One
     signature (APR-2). Compare S06 (exactly 50,000: dual).
