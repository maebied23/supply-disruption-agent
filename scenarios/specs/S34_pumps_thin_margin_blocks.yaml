worked_answer: |
  1. Claim. PO-7002: 70 on 5 Mar, 30 on 20 Apr. Verified.

  2. Pegging. MTR-7: 40 on hand, 200 on 15 Feb, 70 on 5 Mar, 30 on 20 Apr. WO-1 (21 Feb)
     takes the 200. WO-2 (OEM, 80, 7 Mar) takes the 70 and 10 on hand. WO-3 (distributor,
     60, 26 Mar) gets the other 30 on hand: short 30 until 20 Apr -> done 23 Apr, 23 days after
     the 31 Mar promise. Default penalty 1 %/week: 4 weeks x 1 % x 800 x 60 = 1,920 (cap 5 %
     = 2,400). Partial delivery allowed: 30 at risk.

  3. Options (EUR).
     OPT-SUP-DRIVE: minimum 50 at 228 (arrives 15 Feb), cancels the late 30:
       16.40 x 50 = 820; risk 0.20 x one week late (1 % x 800 x 60 = 480) = 96 -> 916.
     OPT-PARTIAL: 30 pumps on 29 Mar as planned, 30 on 23 Apr: 4 % x 800 x 30 = 960.
     OPT-SUP-ELEC: 30 at 265: 53.40 x 30 = 1,602; risk 0.03 x 480 = 14.40 -> 1,616.40.
     OPT-WAIT: 1,920.
     OPT-REALLOC (WO-3 before the OEM's WO-2): the OEM line goes 42 days late: fixed 6,000 +
       goodwill 200 x 39 = 7,800 -> 13,800. The utility's WO-1 is protected (tier 1).

  4. Mandate. Next best is partial delivery at 960: headroom 960 - 96 = 864; less 10 % =
     777.60; per unit 15.552 -> 15.55; ceiling 211.60 + 15.55 = EUR 227.15. The offer is
     228: outside. The best option is blocked (outside-mandate) and the policy says
     escalate: head_of_purchasing decides between paying 0.85 over the ceiling and partial
     delivery. With a 0 % margin the ceiling would be 228.88 and the buy would go ahead
     (see the margin sweep).
