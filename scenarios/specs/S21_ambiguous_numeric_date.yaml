worked_answer: |
  03/12/2026 is 3 December day-first and 12 March month-first; both are real dates. The
  extractor reads 2026-12-03, but the grounding check reports it as one reading of an
  ambiguous date, so the claim stays unverified. A templated status request asks SUP-A
  to confirm; the planner gets a review task. (3 Dec would leave the hotel on time; reading
  it the other way would not even be a delay. Neither is safe to assume.)
