worked_answer: |
  1. Watch. POL-4472-1 has no confirmed date; confirmation is due 7 days before the
     expected 25 Nov, so the no-response check is set for 18 Nov 08:00.
  2. 10 Nov. SUP-A confirms 300 x CMP-18 for 25 Nov. It matches the record, so it is
     verified and recorded (record_po_confirmation, execute tier). No re-plan.
  3. 18 Nov. The check finds the line confirmed and does nothing: no no_response event,
     no status request, no review task.
