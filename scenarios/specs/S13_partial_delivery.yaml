worked_answer: |
  1. Claims as in S12 (sender gulf.agent@cmp-a.example is also a SUP-A contact). Verified.

  2. Shortage as in S12: WO-2 short 80 of CMP-24 until 15 Jan; base penalty 42,000.

  3. Options. Both quotes expired on 1 Nov; no CMP-24-ALT is on hand; the hotel's supply is
     protected (tier 1). Partial delivery is allowed on SOL-D-2001-1:
     OPT-PARTIAL: 70 units built on schedule (all components on hand by 10 Dec) and
       delivered 20 Dec; 80 built 15-20 Jan. Late units only: 10 % x 2,800 x 80 = 22,400;
       goodwill tier 3 = 0.
     OPT-WAIT: the whole line on 20 Jan: 42,000.

  4. Actions. Split POL-4480-1 to record the supplier's dates (70 on 1 Dec, 80 on 15 Jan;
     CMP-24 is critical: planner). Split SOL-D-2001-1 into 70 promised 20 Dec and 80
     promised 20 Jan; its work order splits with it (WO-2 70 units, WO-2-2 80 units built
     15-20 Jan). Tell the distributor with the delivery_split template.

  5. Governance. The order-line split changes a customer date: customer-date-change, dual,
     [planner, sales_manager]; the head of that rule is sales_manager, then planner. The
     customer message (approve, sales_manager) is in the same bundle. APR-3 then APR-1.
