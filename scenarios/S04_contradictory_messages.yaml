worked_answer: |
  1. 09:12 MSG-S04-1 from a listed SUP-A contact confirms 500 on 10 Nov. On its own it
     would be verified (it matches the record).
  2. 09:40 MSG-S04-2, also from a listed SUP-A contact, says 300 + 200. Both messages are
     about POL-4471-1, disagree on quantity, and arrive 28 minutes apart (< 48 h
     contradiction window). All claims are held as unverified with note "conflict". No
     planning. A templated status request (OUT-N0001, execute tier) asks SUP-A for one
     confirmed position. The planner gets a review task, because the line feeds a tier-1
     order with a fixed penalty.
  3. 14:05 MSG-S04-3 is a reply to OUT-N0001 from a listed contact, so it supersedes the
     held claims. Its claims are verified and match S01's.
  4. From here everything is S01: shortage 200, OPT-B best at 34,500, mandate SAR 1,276.87,
     OFF-B-1 still valid (until 6 Nov), dual approval, the same final state and supplier
     messages. The only extra outbound message is the status request.
