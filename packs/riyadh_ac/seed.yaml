# Seed records for the fictional Riyadh AC assembler. Hand-written for the first
# go/no-go scenarios and kept hand-written (their worked answers cite it); the second pack
# (packs/pumps_eu) shows the generated form.
# Every row is validated against src/sdra/schema.py; all ids must resolve.
#
# Pack assumptions (state in README):
#   - Supplier dates are delivery dates at our plant (DAP Riyadh).
#   - Lead times and assembly times are calendar days in V1.
#   - Assembly needs every component on hand at work-order start; no capacity limit in V1.
#   - A delivery arriving on day D is usable from day D.
#   - Late, undelivered PO quantities may be cancelled without charge (supplier contract term).
#   - Backup suppliers' standing quotes are on file as SupplierOffer rows (no negotiation in V1).
#   - Values are illustrative.

locations:
  - {id: PLANT-RUH, name: Riyadh assembly plant}

items:
  - {id: AC-24, name: "24k BTU split unit", sourcing: make, critical: true, assembly_lead_days: 5}
  - {id: AC-18, name: "18k BTU split unit", sourcing: make, critical: true, assembly_lead_days: 5}
  - {id: CMP-24, name: "Rotary compressor, 24k", sourcing: buy, critical: true}
  - {id: CMP-24-ALT, name: "Rotary compressor, 24k, alternate make", sourcing: buy, critical: true}
  - {id: CMP-18, name: "Rotary compressor, 18k", sourcing: buy, critical: true}
  - {id: CU-KIT-24, name: "Copper tubing kit, 24k", sourcing: buy}
  - {id: CU-KIT-18, name: "Copper tubing kit, 18k", sourcing: buy}
  - {id: PCB-CTRL, name: "Control board", sourcing: buy, critical: true}
  - {id: PKG-24, name: "Carton set, 24k", sourcing: buy}
  - {id: PKG-18, name: "Carton set, 18k", sourcing: buy}
  - {id: FST-KIT, name: "Fastener kit", sourcing: buy}

bom:
  - {parent_item_id: AC-24, component_item_id: CMP-24, qty_per: 1}
  - {parent_item_id: AC-24, component_item_id: CU-KIT-24, qty_per: 1}
  - {parent_item_id: AC-24, component_item_id: PCB-CTRL, qty_per: 1}
  - {parent_item_id: AC-24, component_item_id: PKG-24, qty_per: 1}
  - {parent_item_id: AC-24, component_item_id: FST-KIT, qty_per: 1}
  - {parent_item_id: AC-18, component_item_id: CMP-18, qty_per: 1}
  - {parent_item_id: AC-18, component_item_id: CU-KIT-18, qty_per: 1}
  - {parent_item_id: AC-18, component_item_id: PCB-CTRL, qty_per: 1}
  - {parent_item_id: AC-18, component_item_id: PKG-18, qty_per: 1}
  - {parent_item_id: AC-18, component_item_id: FST-KIT, qty_per: 1}

substitutions:
  # Approved for the distributor only. The hotel chain's spec does not allow it.
  - id: SUB-1
    item_id: CMP-24
    substitute_item_id: CMP-24-ALT
    ratio: 1
    parent_item_ids: [AC-24]
    customer_ids: [CUS-DIST]
    requires_customer_consent: false

stock:
